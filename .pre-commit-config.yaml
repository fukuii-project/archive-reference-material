# Pre-commit hooks for fukuii-project repos.
#   install:  pipx install pre-commit && pre-commit install
#   run all:  pre-commit run --all-files
#
# NOTE (supply-chain policy): the `rev:` pins below are the local secret-scan /
# hygiene toolchain. Verify and bump them deliberately before first use, and
# keep them current -- do not blindly `autoupdate`.

# THIS REPO IS THE ARCHIVE -- inverted from fukuii-tests' design, on purpose.
#
# fukuii-tests excludes one path (`archive/`) because that is the small part of
# a mostly-authored repo that is frozen. Here the frozen material is not a
# fraction of the tree, it IS the tree: six vendored organization directories
# holding 58k+ files, against roughly a dozen root-level files that are this
# project's own. A deny-list keyed on today's six org directories would need a
# same-commit edit every time a seventh is vendored -- exactly the "WARNING:
# this is keyed on PATH" fragility fukuii-tests' own config calls out -- and
# forgetting that edit is not hypothetical: on 2026-08-21 `end-of-file-fixer`
# appended a trailing newline to 6,985 mirrored fixtures in a single commit
# because a mirror sat outside the exclusion nobody remembered to widen.
#
# So this file allow-lists the small, stable, non-archive surface instead of
# denying the large, growing one. `files:` below is a top-level, repo-wide
# filter: pre-commit runs a hook ONLY on paths matching it. Anything that does
# NOT match -- every current vendored org directory, and any future one added
# the same way -- is excluded from every hook below with no config edit
# required at the moment it is added. That is what "covered automatically"
# (rather than "forces a config update in the same commit") means in practice.
#
# A conformance vector's bytes are its meaning; no formatter may touch vendored
# material. The allow-list below covers only what THIS wiring pass introduces
# -- AGENTS.md, CLAUDE.md, LICENSE, NOTICE, the dotfiles, and .github/.claude --
# and deliberately does NOT include README.md, PROVENANCE.md,
# EXTRACTION-historic-clients.md, or .gitmodules, even though all four are this
# project's own prose rather than vendored bytes. Those four are named frozen
# in this repo's own AGENTS.md boundaries, and leaving them out of the
# hook-checked surface is not theoretical caution: an earlier draft of this
# file DID include the three docs, and the first real `pre-commit run
# --all-files` against it immediately had `end-of-file-fixer` strip a trailing
# blank line from PROVENANCE.md -- a small, well-intentioned edit, and still a
# direct violation of "do not touch" on a file this pass was explicitly told
# to leave alone. Reverted, and the docs removed from this pattern rather than
# the incident argued away. `ethereum/EXTRACTION.md` needs no special case: it
# sits one level inside the `ethereum/` org directory, so it is already
# outside this allow-list without naming it.
#
# WARNING: this is keyed on PATH, same as fukuii-tests' exclude -- just
# inverted. A new NON-archive, NON-frozen root file that should be
# hook-checked (a new config file this pass or a later one adds) needs adding
# to the pattern below in the same commit it is introduced, or it silently
# gets no hygiene checking. Do not add README.md, PROVENANCE.md,
# EXTRACTION-historic-clients.md, or .gitmodules back to this pattern without
# first confirming they are no longer frozen -- see AGENTS.md's Boundaries.
#
# check-added-large-files' default (see pre-commit-hooks below) would reject
# vendored blobs on sight -- largest is 62.0 MB -- but under this design that
# hook, like every other one here, never even looks at a vendored path, so no
# maxkb override is needed to accommodate the archive.
files: ^(AGENTS\.md|CLAUDE\.md|LICENSE|NOTICE|\.gitignore|\.gitleaks\.toml|\.pre-commit-config\.yaml|\.github/.*|\.claude/.*)$

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1   # pinned deliberately; last verified 2026-07-18
    hooks:
      - id: gitleaks
        # gitleaks scans the staged diff directly and ignores this file's
        # top-level `files:` filter -- see .gitleaks.toml for what actually
        # governs its reach into the vendored trees.

  # GitHub Actions hardening -- a gap the org Security Configuration does NOT cover
  # (it scans code/secrets/deps, not workflow files). zizmor catches the tj-actions /
  # trivy-action attack class (injection, unpinned actions, cache poisoning).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.27.0   # pinned deliberately; last verified 2026-07-18
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12   # pinned deliberately; last verified 2026-07-18
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0    # pinned deliberately; last verified 2026-07-18
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
